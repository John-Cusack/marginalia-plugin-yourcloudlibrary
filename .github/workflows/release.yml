name: Release

# Protect `v*` tags in the repository settings so only maintainers can trigger this.
#
# Publishing uses PyPI Trusted Publishing — no API token exists for this project.
# Register a *pending* publisher before the first upload
# (https://pypi.org/manage/account/publishing/):
#
#   Project name:  marginalia-ai-plugin-yourcloudlibrary
#   Owner:         John-Cusack
#   Repository:    marginalia-plugin-yourcloudlibrary
#   Workflow:      release.yml
#   Environment:   pypi
#
# The same values apply on TestPyPI (https://test.pypi.org/manage/account/publishing/)
# with environment `testpypi`, once a TestPyPI upload job exists; this workflow
# publishes to production PyPI only. Create both GitHub environments under
# Settings → Environments and add required reviewers before the first tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and verify artifacts
    runs-on: ubuntu-latest
    env:
      YCL_TEST_REQUIRE_REAL_SDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Tag, package version, and changelog agree
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          grep -q "^## ${version} " CHANGELOG.md || { echo "CHANGELOG.md has no ${version} section"; exit 1; }
          if grep -q "^## ${version} — unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks ${version} unreleased"; exit 1
          fi

      - run: uv sync --extra dev
      - run: uv run ruff check ycl tests
      - run: uv run pytest -q    # unit + contract, including wheel/sdist inspection

      - run: uv build
      - run: uvx --from twine twine check --strict dist/*

      - name: Clean-venv smoke (no checkout on the path)
        run: |
          python3 -m venv /tmp/ycl-release-smoke
          /tmp/ycl-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/ycl-release-smoke/bin/python -m pip install "marginalia-ai==0.6.0" dist/*.whl
          cd /tmp
          /tmp/ycl-release-smoke/bin/research-engine plugin list | tee plugin-list.txt
          grep -q yourcloudlibrary plugin-list.txt
          /tmp/ycl-release-smoke/bin/research-engine-ycl-login --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/marginalia-ai-plugin-yourcloudlibrary/
    permissions:
      id-token: write   # Trusted Publishing; no API token exists for this project
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # v1.14.2. PEP 740 attestations are on by default; never add skip-existing.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  verify:
    name: smoke the published release from PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install from production PyPI and discover
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/ycl-pypi-smoke
          /tmp/ycl-pypi-smoke/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6; do
            /tmp/ycl-pypi-smoke/bin/python -m pip install --no-cache-dir \
              "marginalia-ai==0.6.0" \
              "marginalia-ai-plugin-yourcloudlibrary==${version}" && break
            sleep 30
          done
          /tmp/ycl-pypi-smoke/bin/research-engine plugin list | tee plugin-list.txt
          grep -q yourcloudlibrary plugin-list.txt
          /tmp/ycl-pypi-smoke/bin/research-engine-ycl-login --help
