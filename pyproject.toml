[project]
name = "research-engine-plugin-yourcloudlibrary"
version = "0.3.0"
description = "YourCloudLibrary catalog search and borrowed-book ingestion for Research Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "John Cusack" }]
keywords = [
    "research-engine",
    "research-engine-plugin",
    "yourcloudlibrary",
    "cloudlibrary",
    "library",
    "ebooks",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
# Playwright is a base dependency, not an extra: besides the one-time login,
# catalog search (ycl.search_catalog and the search_sources provider) only returns
# results from a warmed browser context — measured, see IMPL_NOTES.md. The
# Chromium build itself is never downloaded at install time.
dependencies = [
    "research-engine-sdk>=0.6,<0.7",
    "playwright>=1.40,<2",
    "httpx>=0.28.1,<1",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/marginalia-plugin-yourcloudlibrary"
Source = "https://github.com/John-Cusack/marginalia-plugin-yourcloudlibrary"
Issues = "https://github.com/John-Cusack/marginalia-plugin-yourcloudlibrary/issues"
Changelog = "https://github.com/John-Cusack/marginalia-plugin-yourcloudlibrary/blob/main/CHANGELOG.md"

[project.scripts]
research-engine-ycl-login = "ycl.cli.login:main"

# Discovery marker only: core reads ycl/plugin.yaml from this distribution and
# never imports `ycl` until the plugin is explicitly enabled.
[project.entry-points."research_engine.plugins"]
yourcloudlibrary = "ycl"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ycl"]

# Allow-list, so probe scripts, scratch captures, notes, and anything else in the
# checkout can't ride along into the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["ycl", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Opt-in tiers stay out of a bare `pytest`; select them with `-m integration` / `-m live`.
addopts = ["-m", "not integration and not live"]
markers = [
    "contract: packaging/manifest/SDK contract checks (no network, no core)",
    "integration: needs research-engine 0.6 and a disposable Postgres (RE_DB_URL)",
    "live: talks to the real YourCloudLibrary site with your saved session",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["research_engine_sdk"]

[tool.ruff.lint.per-file-ignores]
# Imports used only at module level for runtime behavior — moving them into
# TYPE_CHECKING would break the actual code paths that depend on them.
"ycl/borrows.py" = ["TC003"]
"ycl/api/client.py" = ["TC003"]
"ycl/api/cookies.py" = ["TC003"]
"scripts/*.py" = ["SIM105", "B007", "F841"]
# Pydantic/dataclass models in the SDK stand-in need their annotation types at runtime.
"tests/_sdk_standin/**" = ["TC003"]
